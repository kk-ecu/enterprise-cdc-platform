# ==============================================================================
# Enterprise CDC Platform: Core Platform Properties
# ==============================================================================
# 12-Factor externalized configuration for Apache Kafka, Debezium, Schema Registry,
# Control Plane API, SMT transforms, and Golden Signals observability.
# ==============================================================================

# Control Plane API Configuration
app.name=Enterprise CDC Platform Control Plane
app.version=1.0.0
app.environment=local-m2
app.host=0.0.0.0
app.port=8000
app.api.prefix=/api/v1
app.log.level=INFO
app.memory.cap.mb=11520

# Apache Kafka (KRaft Mode) Broker Properties
kafka.bootstrap.servers=kafka:9092,localhost:9092
kafka.cluster.id=cdc-kraft-cluster-01
kafka.node.id=1
kafka.controller.quorum.voters=1@kafka:9093
kafka.num.partitions=3
kafka.replication.factor=1
kafka.min.insync.replicas=1
kafka.producer.acks=all
kafka.producer.idempotence=true
kafka.compression.type=snappy
kafka.retention.ms=604800000
kafka.segment.bytes=104857600

# Debezium / Kafka Connect Distributed Cluster Properties
connect.rest.url=http://localhost:8083
connect.internal.rest.url=http://debezium-connect:8083
connect.worker.id=connect-worker-01:8083
connect.tasks.max=1
connect.config.storage.topic=cdc_connect_configs
connect.offset.storage.topic=cdc_connect_offsets
connect.status.storage.topic=cdc_connect_statuses
connect.key.converter=org.apache.kafka.connect.json.JsonConverter
connect.value.converter=org.apache.kafka.connect.json.JsonConverter
connect.key.converter.schemas.enable=true
connect.value.converter.schemas.enable=true
connect.internal.key.converter=org.apache.kafka.connect.json.JsonConverter
connect.internal.value.converter=org.apache.kafka.connect.json.JsonConverter

# Confluent Schema Registry Properties
schema.registry.url=http://localhost:8081
schema.registry.internal.url=http://schema-registry:8081
schema.registry.compatibility.mode=BACKWARD
schema.registry.wire.format.magic.byte=0
schema.registry.default.schema.id=43
schema.registry.schema.version=2

# Single Message Transformation (SMT) & Data Governance
smt.transforms.list=unwrap,maskEmail,maskCard
smt.salt=cdc-enterprise-salt-secure-hash-2026
smt.email.fields=email,customer_email
smt.email.replacement=REDACTED_PII
smt.card.fields=credit_card,card_number,tax_id
smt.card.replacement=XXXX-XXXX-XXXX-XXXX
smt.unwrap.type=io.debezium.transforms.ExtractNewRecordState
smt.unwrap.drop.tombstones=false

# Non-Blocking Incremental Snapshot (DBlog Algorithm)
snapshot.algorithm=DBlog
snapshot.watermark.table=public.cdc_signal
snapshot.chunk.size.rows=1024
snapshot.signal.topic=cdc.signals

# Dead Letter Queue (DLQ) & Poison Pill Isolation
dlq.topic.prefix=cdc.dlq
dlq.orders.unparseable.topic=cdc.dlq.orders.unparseable
dlq.max.retry.attempts=3
dlq.retry.backoff.ms=1000

# Golden Signals & Observability SLO Targets
metrics.throughput.target.eps=1842.0
metrics.p95.latency.target.ms=142.0
metrics.p99.latency.target.ms=380.0
metrics.wal.slot.lag.target.bytes=0
metrics.memory.budget.mb=11520
metrics.memory.used.mb=9600
