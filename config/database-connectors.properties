# ==============================================================================
# Enterprise CDC Platform: Database Connectors & Sources Configuration
# ==============================================================================
# All connectivity parameters, hostnames, ports, credentials, database names,
# URLs, and CDC log extraction settings externalized with ZERO hardcoding.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PostgreSQL Source (Logical Replication via pgoutput)
# ------------------------------------------------------------------------------
postgres.source.id=src-pg-orders
postgres.source.engine=postgres
postgres.source.host=postgres-source
postgres.source.port=5432
postgres.source.external.port=5433
postgres.source.database=orders_db
postgres.source.user=postgres
postgres.source.password=postgrespassword
postgres.source.url=postgresql://postgres:postgrespassword@postgres-source:5432/orders_db
postgres.connector.class=io.debezium.connector.postgresql.PostgresConnector
postgres.plugin.name=pgoutput
postgres.topic.prefix=cdc.local.ecommerce.orders_db
postgres.table.include.list=public.orders,public.customers
postgres.snapshot.mode=initial
postgres.signal.data.collection=public.cdc_signal
postgres.publication.autocreate.mode=all_tables
postgres.tombstones.on.delete=true
postgres.decimal.handling.mode=double
postgres.wal_level=logical
postgres.max_replication_slots=5
postgres.max_wal_senders=5
postgres.shared_buffers=384MB

# ------------------------------------------------------------------------------
# 2. MySQL Source (ROW Binlog & GTID Mode)
# ------------------------------------------------------------------------------
mysql.source.id=src-my-inventory
mysql.source.engine=mysql
mysql.source.host=mysql-source
mysql.source.port=3306
mysql.source.external.port=3307
mysql.source.database=inventory
mysql.source.user=mysqluser
mysql.source.password=mysqlpassword
mysql.source.root.password=mysqlrootpassword
mysql.source.server.id=184054
mysql.source.url=mysql://mysqluser:mysqlpassword@mysql-source:3306/inventory
mysql.connector.class=io.debezium.connector.mysql.MySqlConnector
mysql.topic.prefix=cdc.local.mysql_store.inventory
mysql.table.include.list=inventory.products,inventory.customers
mysql.snapshot.mode=initial
mysql.schema.history.internal.kafka.bootstrap.servers=kafka:9092
mysql.schema.history.internal.kafka.topic=schema-changes.inventory
mysql.include.schema.changes=true
mysql.gtid.source.filter.dml.events=true
mysql.binlog_format=ROW
mysql.binlog_row_image=FULL
mysql.gtid_mode=ON
mysql.innodb_buffer_pool_size=512M

# ------------------------------------------------------------------------------
# 3. MariaDB Source (ROW Binlog & GTID Strict Mode)
# ------------------------------------------------------------------------------
mariadb.source.id=src-maria-catalog
mariadb.source.engine=mariadb
mariadb.source.host=mariadb-source
mariadb.source.port=3306
mariadb.source.external.port=3308
mariadb.source.database=store_catalog
mariadb.source.user=mariadbuser
mariadb.source.password=mariadbpassword
mariadb.source.root.password=mariadbrootpassword
mariadb.source.server.id=184055
mariadb.source.url=mariadb://mariadbuser:mariadbpassword@mariadb-source:3306/store_catalog
mariadb.connector.class=io.debezium.connector.mysql.MySqlConnector
mariadb.topic.prefix=cdc.local.mariadb_store.store_catalog
mariadb.table.include.list=store_catalog.products,store_catalog.inventory
mariadb.snapshot.mode=initial
mariadb.schema.history.internal.kafka.bootstrap.servers=kafka:9092
mariadb.schema.history.internal.kafka.topic=schema-changes.mariadb.store_catalog
mariadb.include.schema.changes=true
mariadb.gtid.source.filter.dml.events=true
mariadb.binlog_format=ROW
mariadb.binlog_row_image=FULL
mariadb.gtid_strict_mode=ON
mariadb.innodb_buffer_pool_size=384M

# ------------------------------------------------------------------------------
# 4. MongoDB Source (Replica Set Change Streams & Resume Token)
# ------------------------------------------------------------------------------
mongodb.source.id=src-mongo-catalog
mongodb.source.engine=mongodb
mongodb.source.host=mongo-source
mongodb.source.port=27017
mongodb.source.external.port=27018
mongodb.source.database=store
mongodb.source.user=mongoadmin
mongodb.source.password=mongopassword
mongodb.source.replica.set=rs0
mongodb.source.connection.string=mongodb://mongo-source:27017/?replicaSet=rs0
mongodb.connector.class=io.debezium.connector.mongodb.MongoDbConnector
mongodb.topic.prefix=cdc.local.mongodb_catalog.store
mongodb.collection.include.list=store.products,store.orders
mongodb.snapshot.mode=initial
mongodb.capture.mode=change_streams_update_lookup

